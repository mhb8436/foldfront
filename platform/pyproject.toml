[project]
name = "foldfront"
version = "0.1.0"
description = "단백질 설계 모델을 자유형 DAG 워크플로로 조합해 실행·비교·관리한다"
requires-python = ">=3.12"
dependencies = [
    "pipeline-mcp",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pymongo>=4.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.4",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    #  Surrogate triage loads and runs the exported MLPs directly (engine/surrogate.py).
    #  Pinned to the line the models are pickled with, so a load never warns of a
    #  version skew - which matters for a certification-target build.
    "numpy>=1.26,<3",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldfront"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
