#  TLS termination in front of the platform.
#
#  Separate from deploy/nginx/kbf.conf, which is the original author's and
#  proxies the original http_server on 18080. That file is inherited and is
#  not edited; this one is ours and fronts the new API.
#
#  The application speaks plain HTTP to this proxy over the loopback and
#  never off the machine. Terminating here rather than in the application is
#  the ordinary arrangement and the one an institution's own load balancer
#  will replace: the certificate, the cipher list and the renewal are theirs
#  to run, and the application should not hold a private key to do its job.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  #  Nothing is served over plain HTTP but the redirect. An API that answers
  #  on both is an API whose clients will use whichever they first tried.
  return 308 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  #  TLS 1.2 and 1.3 only. 1.0 and 1.1 are withdrawn and an audit will ask.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  #  A run's artifacts are PDB and FASTA files of a size the browser streams.
  client_max_body_size 64m;
  proxy_read_timeout 600s;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://host.docker.internal:18090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #  The application reads this to decide whether to set HSTS. It is set
    #  here and not passed through, so a client cannot claim to be on TLS.
    proxy_set_header X-Forwarded-Proto https;
  }

  location /mcp {
    proxy_pass http://host.docker.internal:18090/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
