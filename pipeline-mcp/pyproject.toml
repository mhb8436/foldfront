#  현행 RAPID 백엔드를 uv 워크스페이스 구성원으로 선언한다.
#  원본에는 pyproject.toml 이 없고 requirements.txt 만 있었다 — 파일을 추가할 뿐
#  src/pipeline_mcp/ 아래 코드는 손대지 않는다.
[project]
name = "pipeline-mcp"
version = "1.0.29"
description = "RAPID — 현행 단백질 설계 파이프라인 (승계 대상)"
#  승계한 원본의 라이선스다. 루트 LICENSE 의 MIT 고지를 그대로 따른다 — NOTICE 참조.
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-jose[cryptography]>=3.4.0",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_mcp"]
